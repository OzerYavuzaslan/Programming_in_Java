version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omniflow-postgres
    environment:
      POSTGRES_DB: omniflow_order_db
      POSTGRES_USER: omniflow_user
      POSTGRES_PASSWORD: omniflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: