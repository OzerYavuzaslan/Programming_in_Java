databaseChangeLog:
  - changeSet:
      id: 2026-11-07-01-create-orders-table
      author: ozer.yavuzaslan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: orders
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: NUMERIC(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2026-11-07-02-add-orders-check-constraints
      author: ozer.yavuzaslan
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM pg_constraint WHERE conname = 'chk_orders_total_amount_non_negative'
      changes:
        - sql:
            sql: >
              ALTER TABLE orders
                ADD CONSTRAINT chk_orders_total_amount_non_negative CHECK (total_amount >= 0),
                ADD CONSTRAINT chk_orders_currency_iso4217 CHECK (currency ~ '^[A-Z]{3}$'),
                ADD CONSTRAINT chk_orders_status CHECK (status IN ('CREATED', 'PAYMENT_PENDING', 'PAID', 'CANCELLED'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE orders
                DROP CONSTRAINT IF EXISTS chk_orders_total_amount_non_negative,
                DROP CONSTRAINT IF EXISTS chk_orders_currency_iso4217,
                DROP CONSTRAINT IF EXISTS chk_orders_status;

  - changeSet:
      id: 2026-11-07-03-create-orders-tenant-status-created-covering-index
      author: ozer.yavuzaslan
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_orders_tenant_status_created_covering
                tableName: orders
      changes:
        - sql:
            sql: >
              CREATE INDEX idx_orders_tenant_status_created_covering
                ON orders (tenant_id, status, created_at)
                INCLUDE (id, total_amount, currency);
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_orders_tenant_status_created_covering;

  - changeSet:
      id: 2026-11-07-04-create-orders-tenant-customer-created-index
      author: ozer.yavuzaslan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_orders_tenant_customer_created
                tableName: orders
      changes:
        - createIndex:
            indexName: idx_orders_tenant_customer_created
            tableName: orders
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: customer_id
              - column:
                  name: created_at

  - changeSet:
      id: 2026-11-07-05-create-orders-idempotency-unique-index
      author: ozer.yavuzaslan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: uq_orders_tenant_idempotency_key
                tableName: orders
      changes:
        - createIndex:
            indexName: uq_orders_tenant_idempotency_key
            tableName: orders
            unique: true
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: idempotency_key

  - changeSet:
      id: 2026-11-07-06-create-order-items-table
      author: ozer.yavuzaslan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: order_items
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_items
                    nullable: false
              - column:
                  name: order_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_items_order
                    references: orders(id)
                    deleteCascade: true
              - column:
                  name: product_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: NUMERIC(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2026-11-07-07-add-order-items-check-constraints
      author: ozer.yavuzaslan
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM pg_constraint WHERE conname = 'chk_order_items_quantity_positive'
      changes:
        - sql:
            sql: >
              ALTER TABLE order_items
                ADD CONSTRAINT chk_order_items_quantity_positive CHECK (quantity > 0),
                ADD CONSTRAINT chk_order_items_unit_price_non_negative CHECK (unit_price >= 0),
                ADD CONSTRAINT chk_order_items_currency_iso4217 CHECK (currency ~ '^[A-Z]{3}$');
      rollback:
        - sql:
            sql: >
              ALTER TABLE order_items
                DROP CONSTRAINT IF EXISTS chk_order_items_quantity_positive,
                DROP CONSTRAINT IF EXISTS chk_order_items_unit_price_non_negative,
                DROP CONSTRAINT IF EXISTS chk_order_items_currency_iso4217;

  - changeSet:
      id: 2026-11-07-08-create-order-items-order-product-unique-index
      author: ozer.yavuzaslan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: uq_order_items_order_product
                tableName: order_items
      changes:
        - createIndex:
            indexName: uq_order_items_order_product
            tableName: order_items
            unique: true
            columns:
              - column:
                  name: order_id
              - column:
                  name: product_id